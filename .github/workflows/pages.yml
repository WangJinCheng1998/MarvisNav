# Publishes the site to GitHub Pages: on every push to main, once a day (to refresh the visitor numbers) and by hand
# (Actions > Deploy the site > Run workflow). The repository's Pages source must be "GitHub Actions"
# (Settings > Pages > Build and deployment > Source).
#
# Before publishing, it writes assets/visits.json for the visitor note in the footer: the page's views and the views
# per country or region, which the page counts with Abacus (https://abacus.jasoncameron.dev, free, no account; the
# country or region comes from the visitor's time zone). It reads one counter per code that a time zone can give (the
# list is in index.html, VISITS_MAP.cc), slowly enough for Abacus's limit of 30 requests in 10 seconds. If Abacus
# cannot be reached, the numbers the site shows now are kept; with no numbers at all, the note simply stays hidden.
name: Deploy the site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Visitor numbers from Abacus
        env:
          COUNTERS: https://abacus.jasoncameron.dev/get/wangjincheng1998-marvisnav/
          SINCE: '2026-10-28'
          LIVE: https://wangjincheng1998.github.io/MarvisNav/assets/visits.json
        run: |
          python3 - <<'EOF'
          import datetime, json, os, re, time, urllib.error, urllib.request
          env = os.environ

          def get(url):
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'marvisnav-pages-deploy'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def count(key):
              for attempt in range(4):
                  try:
                      return int(get(env['COUNTERS'] + key).get('value') or 0)
                  except urllib.error.HTTPError as e:
                      if e.code == 404:                 # never counted
                          return 0
                      if e.code == 429:                 # too fast: wait as asked
                          time.sleep(int(e.headers.get('Retry-After') or 10) + 1)
                          continue
                      raise
              raise RuntimeError('Abacus kept asking to slow down')

          data = None
          try:
              page = open('index.html', encoding='utf-8').read()
              codes = re.search(r"cc: '([A-Z ]+)'", page).group(1).split()
              total = count('views')
              places = []
              for cc in codes:
                  time.sleep(0.4)
                  n = count('cc-' + cc.lower())
                  if n > 0:
                      places.append({'id': cc, 'count': n})
              data = {'since': env['SINCE'], 'total': total, 'places': places,
                      'updated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
          except Exception as e:
              print('Abacus not reached:', e)
              try:
                  data = get(env['LIVE'])
                  print('keeping the numbers the site shows now')
              except Exception as e2:
                  print('no numbers on the site yet either:', e2)

          if data and data.get('total'):
              with open('assets/visits.json', 'w') as f:
                  json.dump(data, f, separators=(',', ':'))
              print('views:', data['total'], 'countries and regions:', len(data.get('places', [])))
          else:
              print('no views yet: the note stays hidden')
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
